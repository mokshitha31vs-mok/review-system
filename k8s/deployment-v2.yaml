apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-system-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-system-v2
  template:
    metadata:
      labels:
        app: review-system-v2
    spec:
      containers:
        - name: review-system
          image: mmokshitha/review-system:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 5000